:root{
 --bg:#12100c;--surf:#1c1a16;--surf2:#232019;--line:#2c2c2a;--axis:#383835;
 --ink:#ffffff;--ink2:#c3c2b7;--mut:#898781;--rail:#151310;

 --bg:#f2f1ec;--surf:#fcfcfb;--surf2:#f4f3ee;--line:#e1e0d9;--axis:#c3c2b7;

 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#2e93bd;--s7:#4a3aa7;--s8:#e34948;

@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
 --bg:#f2f1ec;--surf:#fcfcfb;--surf2:#f4f3ee;--line:#e1e0d9;--axis:#c3c2b7;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--rail:#171511;

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* sidebar */
.rail{width:238px;flex-shrink:0;background:var(--rail);color:#dfe8f5;display:flex;flex-direction:column;padding:16px 12px;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand .t{font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand .s{font-size:11px;color:#9a9a92;margin-top:2px}
.navgroup{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7f7f78;font-weight:700;padding:12px 12px 5px}
.navb{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;color:#cfcfc6;font-weight:600;font-size:13px;border:0;background:transparent;width:100%;text-align:left;transition:.12s}
.navb .ic{width:20px;text-align:center;font-size:15px;filter:grayscale(.2)}
.navb:hover{background:rgba(255,255,255,.06)}
.navb[aria-current=true]{background:color-mix(in srgb,var(--acc,#3987e5) 26%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--acc,#3987e5)}
.railfoot{margin-top:auto;font-size:10px;color:#78786f;padding:10px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em}.top .desc{font-size:12px;color:var(--mut);margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink2);padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
.iconbtn{background:var(--surf2);border:1px solid var(--line);color:var(--ink2);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px}
.content{padding:22px 24px 64px;max-width:1200px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.k4,.k3{grid-template-columns:repeat(2,1fr)}.k2{grid-template-columns:1fr}.rail{width:60px}.brand .t,.brand .s,.navgroup,.navb span.lbl{display:none}.navb{justify-content:center}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
/* KPI card con sparkline + delta + semáforo */
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.kpi .strip{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi .lab{color:var(--mut);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;min-height:16px}
.kpi .valrow{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .spark{margin-top:8px;height:26px}
.kpi .sub{font-size:11px;margin-top:6px;color:var(--ink2)}
.stat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.stat.good{background:var(--goodbg);color:var(--good)}.stat.warn{background:var(--warnbg);color:var(--warn)}.stat.crit{background:var(--critbg);color:var(--crit)}.stat.serious{background:var(--seriousbg);color:var(--serious)}.stat.info{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sec{margin-top:22px}.sec h2{font-size:14.5px;margin:0 0 10px;font-weight:750;letter-spacing:-.01em}
.chartbox{position:relative;height:300px}.chartbox.sm{height:240px}
.hint{color:var(--mut);font-size:12px;line-height:1.5}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.cardhead h2{font-size:14px;margin:0;font-weight:700}
.tbtn{background:var(--surf2);border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:600;border-radius:7px;padding:4px 9px;cursor:pointer}
.tbtn[aria-pressed=true]{color:var(--ink);border-color:var(--axis)}
table.dv{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:6px}
table.dv th,table.dv td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right}
table.dv th:first-child,table.dv td:first-child{text-align:left;color:var(--ink2)}
table.dv th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.bg-good{background:var(--goodbg);color:var(--good)}.bg-warn{background:var(--warnbg);color:var(--warn)}.bg-crit{background:var(--critbg);color:var(--crit)}
.metarow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.metarow:last-child{border-bottom:0}
.metaname{flex:1;font-size:13px}.metaname b{font-weight:700}
.bar{flex:0 0 180px;height:9px;background:var(--surf2);border-radius:6px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:6px}
.pctv{flex:0 0 74px;text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.note{background:var(--surf2);border:1px solid var(--line);border-left:4px solid var(--s4);border-radius:10px;padding:12px 14px;color:var(--ink2);font-size:12.5px;line-height:1.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:6px}
.na{padding:40px;text-align:center;color:var(--mut);font-size:14px}
.pill{display:inline-block;background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink2);margin-right:6px}
[hidden]{display:none!important}

 return `<div class="metarow"><div class="metaname"><b>${n}</b><br><span class="hint">${s}</span></div><div class="bar"><span style="width:${Math.max(2,Math.min(100,p)).toFixed(0)}%;background:var(${col})"></span></div><div class="pctv" style="color:var(${col})">${p.toFixed(0)}%</div></div>`;}).join('');}
function naMsg(txt){return `<div class="na">${txt}</div>`;}

 const ann=s['2026_anualizado'];

 h+=H3('Situación actual')+P(`En <b>${LBL}</b> de salud mental, la serie re-mapeada muestra 2022: ${money(s['2022'])}, 2023: ${money(s['2023'])}, 2024: ${money(s['2024'])}, 2025: ${money(s['2025'])} y un cierre 2026 estimado de <b>${money(ann)}</b>. La tendencia es de ${pr.slope>=0?'crecimiento':'descenso'} (${pr.slope>=0?'+':''}${money(pr.slope)}/año).`);
 h+=H3('Lectura salubrista')+P(`La comparación interanual, posible gracias al re-mapeo de los formularios antiguos, permite distinguir señal de ruido. ${ann<pr['2026_reg']*0.85?'El cierre 2026 proyectado queda por debajo de la tendencia histórica, lo que amerita revisar acceso y registro.':'El comportamiento 2026 es coherente con la trayectoria de los últimos años.'} En una red rural, sostener estos programas depende de la continuidad del equipo y del vínculo con la comunidad más que de la infraestructura.`);
 h+=H3('Proyección')+P(`El modelo de regresión estima <b>${money(pr['2027_reg'])}</b> ${LBL} para 2027 (banda ±${money(pr.band)}). Es una estimación estadística provisional, útil para dimensionar recursos, no una meta.`);
 h+=RECS(['Usar la proyección para planificar horas y cupos del próximo año con base en evidencia local.','Validar cada salto interanual grande contra posibles cambios de registro antes de interpretarlo como cambio real.','Extender el re-mapeo a producción y otros programas para replicar esta lectura interanual en todo el tablero.']);
 h+=NOTE('Regresión lineal sobre años completos 2022–2025; 2026 anualizado desde ene–ago. Provisional.');
 return h;}

function repAdol(){const e=exd();if(!e)return P('El Programa Adolescente es de APS; no aplica a la urgencia.');
 const ctrl=sum(e.adol_ctrl),ea=sum(e.adol_ea),craff=sum(e.adol_craff);const eaPct=ctrl?ea/ctrl*100:0;
 const pbc=SP.prog['Adolescente'][centro==='consolidado'?'consolidado':centro];
 let h=repHead();
 h+=H3('Situación actual')+P(`Se realizaron <b>${money(ctrl)}</b> controles integrales de adolescentes, de los cuales <b>${money(ea)}</b> (${eaPct.toFixed(0)}%) fueron en <b>Espacio Amigable</b>. Se aplicaron <b>${money(craff)}</b> tamizajes CRAFF. La población bajo control adolescente es de <b>${money(pbc[2])}</b> (Serie P9).`);
 h+=H3('Lectura salubrista')+P(`${eaPct>=40?'La alta proporción de controles en Espacio Amigable habla de una estrategia adolescente-friendly consolidada, algo especialmente valioso en zonas rurales donde el/la joven tiene pocos espacios de atención pertinentes.':'Conviene fortalecer el Espacio Amigable como puerta de entrada: en ruralidad, un espacio adolescente-friendly y confidencial mejora la adherencia y la pesquisa de riesgo (consumo, salud mental, salud sexual).'} El CRAFF y el PHQ-9 son las herramientas de pesquisa clave; sostener su aplicación en cada control es lo que permite intervenir a tiempo.`);
 h+=RECS(['Sostener y difundir el Espacio Amigable en establecimientos educacionales y con horario protegido, acercándolo a Guanaqueros.','Asegurar la aplicación sistemática de CRAFF y PHQ-9 en el control de salud integral, con flujo claro de derivación ante pesquisa positiva.','Articular con educación y el intersector para captar a adolescentes que no consultan espontáneamente.']);
 h+=NOTE('Adolescente desde A01 Sección D (incluye Espacio Amigable) y A03 (tamizajes). PBC desde Serie P9.');
 return h;}
function repDent(){const e=exd();if(!e)return P('El Programa Dental es de APS; no aplica a la urgencia.');
 const ctrl=sum(e.dent_ctrl),urg=sum(e.dent_urg),altas=sum(e.dent_altas),activ=sum(e.dent_activ),ingr=sum(e.dent_ingr);
 const urgR=ctrl?urg/(ctrl+urg)*100:0;
 let h=repHead();
 h+=H3('Situación actual')+P(`Salud bucal registra <b>${money(ctrl)}</b> controles, <b>${money(urg)}</b> urgencias GES y <b>${money(activ)}</b> actividades odontológicas, con <b>${money(altas)}</b> altas integrales sobre ${money(ingr)} ingresos con enfoque de riesgo.`);
 h+=H3('Lectura salubrista')+P(`${urgR>35?'La urgencia GES pesa fuerte respecto de la atención programada, lo que sugiere un patrón de acceso reactivo — se llega al box cuando ya duele.':'La relación entre atención programada y urgencia es razonable.'} En ruralidad, la baja frecuencia de atención dental y la distancia empujan hacia la urgencia; el trabajo preventivo (educación en técnica de higiene, sellantes, fluoruración) y las altas integrales son lo que rompe ese círculo.`);
 h+=RECS(['Reforzar la atención odontológica programada y preventiva (GES odontológico del adolescente y de la embarazada, altas integrales) para reducir la urgencia evitable.','Llevar educación en higiene y aplicación de flúor a establecimientos educacionales y a Guanaqueros.','Monitorear la razón altas/ingresos como indicador de resolutividad del programa.']);
 h+=NOTE('Salud bucal desde REM-A09.');
 return h;}
function repPart(){const e=exd();if(!e)return P('Participación y Educación son de APS; no aplican a la urgencia.');
 const consej=sum(e.edu_consej),grupal=sum(e.edu_ingresos),recl=sum(e.par_reclamos),felic=sum(e.par_consultas),social=sum(e.par_social);
 let h=repHead();
 h+=H3('Situación actual')+P(`En educación para la salud se registran <b>${money(consej)}</b> consejerías individuales y <b>${money(grupal)}</b> ingresos a educación grupal. En participación (OIRS) hay <b>${money(recl)}</b> reclamos y <b>${money(felic)}</b> felicitaciones/sugerencias; las sesiones de participación social suman <b>${money(social)}</b>.`);
 h+=H3('Lectura salubrista')+P(`La educación individual es fuerte, pero ${grupal<consej*0.1?'la educación grupal aparece baja: es una oportunidad, porque los talleres rinden mucho por hora-profesional y construyen comunidad':'el balance individual/grupal es adecuado'}. ${social===0?'La participación social formal (consejos, cuentas públicas, diálogos) no registra actividad en el periodo, algo a revisar: en el mundo rural la participación de la comunidad es un determinante directo de la pertinencia y la confianza en el centro.':'La participación social registra actividad, lo que fortalece el vínculo con la comunidad.'} Los reclamos, más que un problema, son información para mejorar el trato y el acceso.`);
 h+=RECS(['Potenciar la educación grupal (talleres por ciclo vital y área temática) como complemento de la consejería individual.','Reactivar y registrar las instancias de participación social (consejo de desarrollo, cuentas públicas, diálogos ciudadanos), clave para la pertinencia rural.','Cerrar el ciclo de los reclamos OIRS con respuesta oportuna y mejora visible; comunicar los cambios a la comunidad.']);
 h+=NOTE('Participación desde A19b (OIRS, participación social, satisfacción) y Educación desde A19a (consejerías) y A27 (educación grupal).');
 return h;}
function repSP(){const key=centro==='201178'?null:(centro==='consolidado'?'consolidado':centro);
 if(!key)return P('La Serie P es de APS; no aplica a la urgencia.');
 const sm=SP.prog['Salud mental'][key],pm=SP.prog['Personas mayores'][key],cv=SP.prog['PSCV'][key];
 let h=repHead();
 h+=H3('Situación actual')+P(`Entre los cortes de diciembre 2024 y junio 2026, la población bajo control evolucionó así: Salud Mental ${money(sm[0])}→${money(sm[2])}, Personas Mayores ${money(pm[0])}→${money(pm[2])}, PSCV ${money(cv[0])}→${money(cv[2])}. La comparación mezcla cortes de diciembre (2024, 2025) con uno de junio (2026).`);
 h+=H3('Lectura salubrista')+P(`El seguimiento interanual de la Serie P muestra la carga crónica del centro y hacia dónde crece. ${sm[2]>sm[1]?'El alza sostenida en salud mental es la señal más fuerte y exige capacidad instalada (horas, teleconsultoría, consultoría).':''} ${pm[2]>pm[1]?'El crecimiento en personas mayores refleja el envejecimiento local y demanda más cuidado domiciliario y manejo de dependencia.':''} En una red rural, cada persona bajo control implica continuidad en el tiempo: el desafío no es solo captar, sino no perder el seguimiento.`);
 h+=RECS(['Planificar las horas de los programas crónicos según la progresión real de la Serie P, no solo la demanda espontánea.','Estandarizar el corte comparado (usar diciembre con diciembre) para lecturas interanuales limpias.','Anticipar el crecimiento de salud mental y personas mayores con estrategias de continuidad (rescate, domiciliario, telesalud).']);
 h+=NOTE('Serie P (P1/P2/P4/P5/P6/P9/P13), cortes dic-2024, dic-2025 y jun-2026. 2026 es corte de mitad de año.');
 return h;}

const REPORT={resumen:repResumen,prod:repProd,cv:repCV,resp:repResp,sm:repSM,ccr:repCCR,chcc:repChCC,pacom:repPacom,cob:repCob,proy:repProy,adol:repAdol,dent:repDent,part:repPart,sp:repSP};

 ccr:['Rehabilitación CCR','Centro Comunitario de Rehabilitación (A28) — incl. Terapeuta Ocupacional'],
 chcc:['Chile Crece Contigo','Desarrollo infantil 0–9 — pesquisa EEDP/TEPSI y Sala de Estimulación'],
 pacom:['PACOM / PASMI','Acompañamiento psicosocial y apoyo a la salud mental infantil'],
 cob:['Coberturas','PAP, EMP y PSCV sobre el percápita unificado de Tongoy'],
 proy:['Proyección y comparación interanual','Salud Mental 2022–2026 (formularios re-mapeados) y predicción a 2027'],
 adol:['Programa Adolescente · Espacios Amigables','Control integral 10–19, Espacio Amigable y tamizajes (A01/A03)'],
 dent:['Programa Dental','Salud bucal — controles, urgencia GES, altas y prevención (A09)'],
 part:['Participación y Educación','Mapeo REM de participación social (A19b) y educación para la salud (A19a/A27)'],
 sp:['Serie P comparativa','Progresión de la población bajo control por programa (2024–2026)']};

function activate(m){
 mod=m;
 document.querySelectorAll('.navb').forEach(b=>b.setAttribute('aria-current',b.dataset.mod===m));
 document.querySelectorAll('.content > section').forEach(sec=>sec.hidden = sec.id!=='m-'+m);
 $('#modTitle').textContent=TITLES[m][0]; $('#modDesc').textContent=TITLES[m][1];
 RENDER[m]();
}
document.querySelectorAll('.navb').forEach(b=>b.onclick=()=>activate(b.dataset.mod));
$('#centro').querySelectorAll('button').forEach(b=>b.onclick=()=>{centro=b.dataset.c;
 $('#centro').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===centro));RENDER[mod]();});
$('#theme').onclick=()=>{const r=document.documentElement,c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':(c==='light'?'dark':'light'));RENDER[mod]();};
$('#btnInforme').onclick=openReport;
$('#repClose').onclick=()=>$('#repOv').setAttribute('hidden','');
$('#repOv').onclick=e=>{if(e.target===$('#repOv'))$('#repOv').setAttribute('hidden','');};
$('#repCopy').onclick=()=>{const t=$('#repBody').innerText;navigator.clipboard&&navigator.clipboard.writeText(t);const b=$('#repCopy');b.textContent='Copiado ✓';setTimeout(()=>b.textContent='Copiar',1500);};
activate('resumen');
