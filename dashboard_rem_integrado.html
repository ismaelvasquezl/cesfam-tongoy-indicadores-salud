<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard REM · CESFAM Tongoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ---- Tokens: paleta categórica y de estado validadas (dataviz) ---- */
:root{
 --bg:#12100c;--surf:#1c1a16;--surf2:#232019;--line:#2c2c2a;--axis:#383835;
 --ink:#ffffff;--ink2:#c3c2b7;--mut:#898781;--rail:#151310;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#4aa3c9;--s7:#9085e9;--s8:#e66767;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
 --goodbg:rgba(12,163,12,.16);--warnbg:rgba(250,178,25,.16);--critbg:rgba(208,59,59,.16);--seriousbg:rgba(236,131,90,.16);}
:root[data-theme=light]{
 --bg:#f2f1ec;--surf:#fcfcfb;--surf2:#f4f3ee;--line:#e1e0d9;--axis:#c3c2b7;
 --ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--rail:#171511;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#2e93bd;--s7:#4a3aa7;--s8:#e34948;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
 --bg:#f2f1ec;--surf:#fcfcfb;--surf2:#f4f3ee;--line:#e1e0d9;--axis:#c3c2b7;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--rail:#171511;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#2e93bd;--s7:#4a3aa7;--s8:#e34948;}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
.disp{font-family:"Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif}
.app{display:flex;min-height:100vh}
/* sidebar */
.rail{width:252px;flex-shrink:0;background:var(--rail);color:#dfe8f5;display:flex;flex-direction:column;padding:16px 14px 10px;gap:1px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 15px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a78d6,#1baf7a);box-shadow:0 5px 16px rgba(42,120,214,.4)}
.brand .t{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.12}
.brand .s{font-size:10.5px;color:#9a9a92;margin-top:2px}
.navgroup{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#71727b;font-weight:700;padding:14px 12px 6px}
.navb{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:11px;cursor:pointer;color:#c7ccd6;font-weight:600;font-size:13px;border:0;background:transparent;width:100%;text-align:left;position:relative;transition:background .16s ease,transform .16s ease,color .16s ease}
.navb .ic{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:15px;line-height:1;background:color-mix(in srgb,var(--acc,#3987e5) 17%,transparent);transition:background .16s ease,transform .24s cubic-bezier(.34,1.56,.5,1),box-shadow .16s}
.navb .lbl{line-height:1.14;letter-spacing:-.005em}
.navb:hover{background:rgba(255,255,255,.055);color:#fff;transform:translateX(2px)}
.navb:hover .ic{background:color-mix(in srgb,var(--acc,#3987e5) 30%,transparent)}
.navb:active .ic{transform:scale(.88)}
.navb[aria-current=true]{background:color-mix(in srgb,var(--acc,#3987e5) 15%,transparent);color:#fff}
.navb[aria-current=true] .ic{background:var(--acc,#3987e5);box-shadow:0 3px 12px color-mix(in srgb,var(--acc,#3987e5) 55%,transparent);transform:scale(1.04)}
.navb[aria-current=true]::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:0 4px 4px 0;background:var(--acc,#3987e5)}
.railfoot{margin-top:auto;font-size:10px;color:#78786f;padding:10px}
@media(prefers-reduced-motion:reduce){.navb,.navb .ic{transition:none}.navb:hover{transform:none}}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-family:"Space Grotesk","Inter",sans-serif;font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}.top .desc{font-size:12px;color:var(--mut);margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink2);padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
.iconbtn{background:var(--surf2);border:1px solid var(--line);color:var(--ink2);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px}
.selmes{background:var(--surf2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.content{padding:22px 24px 64px;max-width:1200px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.k4,.k3{grid-template-columns:repeat(2,1fr)}.k2{grid-template-columns:1fr}.rail{width:72px;padding:14px 11px}.brand{justify-content:center;gap:0}.brand .t,.brand .s,.navgroup,.navb span.lbl{display:none}.navb{justify-content:center;padding:7px}.navb:hover{transform:none}.navb[aria-current=true]::before{display:none}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px 17px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card.kpi:hover{border-color:var(--axis);box-shadow:0 6px 22px -12px rgba(0,0,0,.35);transform:translateY(-1px)}
/* KPI card con sparkline + delta + semáforo */
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.kpi .strip{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi .lab{color:var(--mut);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;min-height:16px;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.kpi .valrow{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.kpi .val{font-family:"Space Grotesk","Inter",sans-serif;font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .spark{margin-top:8px;height:26px}
.kpi .sub{font-size:11px;margin-top:6px;color:var(--ink2)}
.stat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.stat.good{background:var(--goodbg);color:var(--good)}.stat.warn{background:var(--warnbg);color:var(--warn)}.stat.crit{background:var(--critbg);color:var(--crit)}.stat.serious{background:var(--seriousbg);color:var(--serious)}.stat.info{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sec{margin-top:22px}.sec h2{font-family:"Space Grotesk","Inter",sans-serif;font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.chartbox{position:relative;height:300px}.chartbox.sm{height:240px}
.hint{color:var(--mut);font-size:12px;line-height:1.5}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.cardhead h2{font-size:14px;margin:0;font-weight:700}
.tbtn{background:var(--surf2);border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:600;border-radius:7px;padding:4px 9px;cursor:pointer}
.tbtn[aria-pressed=true]{color:var(--ink);border-color:var(--axis)}
table.dv{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:6px}
table.dv th,table.dv td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right}
table.dv th:first-child,table.dv td:first-child{text-align:left;color:var(--ink2)}
table.dv th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.bg-good{background:var(--goodbg);color:var(--good)}.bg-warn{background:var(--warnbg);color:var(--warn)}.bg-crit{background:var(--critbg);color:var(--crit)}
.metarow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.metarow:last-child{border-bottom:0}
.metaname{flex:1;font-size:13px}.metaname b{font-weight:700}
.bar{flex:0 0 180px;height:9px;background:var(--surf2);border-radius:6px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:6px}
.pctv{flex:0 0 74px;text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.note{background:var(--surf2);border:1px solid var(--line);border-left:4px solid var(--s4);border-radius:10px;padding:12px 14px;color:var(--ink2);font-size:12.5px;line-height:1.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:6px}
.na{padding:40px;text-align:center;color:var(--mut);font-size:14px}
.ins .card{padding:13px 15px}
.inshd{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.insg{border-left:4px solid var(--good)} .insg .inshd{color:var(--good)}
.insb{border-left:4px solid var(--warn)} .insb .inshd{color:#8a6400}
:root[data-theme=dark] .insb .inshd{color:var(--warn)}
.ins ul{margin:0;padding-left:16px} .ins li{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:4px}
.ins li b{color:var(--ink)}
.pill{display:inline-block;background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink2);margin-right:6px}
[hidden]{display:none!important}
/* --- Pulso sutil en KPI críticos --- */
@keyframes kpiPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 38%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--crit) 0%,transparent)}}
.kpi-crit{animation:kpiPulse 2.4s ease-in-out infinite;border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.kpi-crit .strip{box-shadow:0 0 8px 0 color-mix(in srgb,var(--crit) 55%,transparent)}
/* --- Botón ampliar en gráficos --- */
.chartbox{position:relative}
.expbtn{position:absolute;top:4px;right:4px;z-index:3;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surf2);color:var(--ink2);cursor:pointer;font-size:13px;line-height:1;opacity:.5;transition:opacity .15s}
.chartbox:hover .expbtn{opacity:1}.expbtn:hover{color:var(--ink);border-color:var(--axis)}
.expov{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.62);display:flex;align-items:center;justify-content:center;padding:28px}
.expbox{background:var(--surf);border:1px solid var(--line);border-radius:16px;width:min(1100px,96vw);height:min(760px,92vh);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.exphd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.exphd .t{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:15px}
.exphost{flex:1;padding:16px 18px;position:relative;min-height:0}
.exphost .chartbox{height:100%!important}
/* --- Calendario-heatmap --- */
.hmap{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px}
.hmap th{color:var(--mut);font-weight:600;font-size:10.5px;text-align:center;padding:2px}
.hmap td.lab{text-align:left;color:var(--ink2);font-weight:600;white-space:nowrap;padding-right:8px}
.hmap td.cell{text-align:center;border-radius:6px;color:#0b0b0b;font-weight:700;font-variant-numeric:tabular-nums;height:30px;min-width:34px}
.hleg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:10px;align-items:center}
.hleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
@media(prefers-reduced-motion:reduce){.kpi-crit{animation:none}*{transition:none!important}}
</style></head><body>
<div class="app">
 <nav class="rail">
  <div class="brand"><div class="mark">🫀</div><div><div class="t">Dashboard REM</div><div class="s">CESFAM Tongoy · Coquimbo</div></div></div>
  <div class="navgroup">General</div>
  <button class="navb" data-mod="resumen" style="--acc:#3987e5"><span class="ic">🏠</span><span class="lbl">Resumen</span></button>

  <div class="railfoot">Fuente: REM Serie A/P · DEIS-MINSAL</div>
 </nav>
 <div class="main">

 <div style="width:min(640px,94vw);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column">

// ---- KPI: sparkline SVG + delta + semáforo con ícono (estado nunca por color solo) ----
const STGLYPH={good:'✓',warn:'▲',serious:'▲',crit:'!',info:'•'};
const STWORD={good:'En rango',warn:'Observar',serious:'Atención',crit:'Alerta',info:''};
function sparkSVG(series,color){const s=series.filter(v=>v!=null);if(s.length<2)return '';
 const w=120,h=26,mn=Math.min(...s),mx=Math.max(...s),rg=(mx-mn)||1;
 const pts=series.map((v,i)=>v==null?null:[i/(series.length-1)*w, h-2-((v-mn)/rg)*(h-4)]).filter(Boolean);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const last=pts[pts.length-1];
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%"><path d="${d}" fill="none" stroke="${cssv(color)}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${cssv(color)}"/></svg>`;}
function kpi(lab,val,sub,st,opts){opts=opts||{};const col=st==='good'?'--good':st==='warn'?'--warn':st==='crit'?'--crit':st==='serious'?'--serious':'--s1';
 const stcls=(st==='good'||st==='warn'||st==='crit'||st==='serious')?st:'info';
 const chip = opts.delta!=null ? `<span class="stat ${opts.delta>=0?'good':'crit'}">${opts.delta>=0?'▲':'▼'} ${opts.delta>=0?'+':''}${opts.delta}%</span>` :
              (STWORD[st]?`<span class="stat ${stcls}">${STGLYPH[st]} ${STWORD[st]}</span>`:'');
 const spark = opts.spark ? sparkSVG(opts.spark, opts.sparkColor||col) : '';
 return `<div class="card kpi${st==='crit'?' kpi-crit':''}"><span class="strip" style="background:var(${col})"></span>`+
  `<div class="lab">${lab}</div>`+
  `<div class="valrow"><div class="val">${val}</div>${chip}</div>`+
  (spark||`<div class="sub">${sub}</div>`)+
  (spark?`<div class="sub">${sub}</div>`:'')+
  `</div>`;}
// tabla de datos accesible (toggle) para un gráfico
function dataTable(headers, rows){
 let h='<table class="dv"><thead><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
 h+=rows.map(r=>'<tr>'+r.map((c,i)=>`<td>${i&&typeof c==='number'?nf.format(c):c}</td>`).join('')+'</tr>').join('');
 return h+'</tbody></table>';}
function wireTable(btnId, boxId){const b=$('#'+btnId),x=$('#'+boxId);if(!b)return;b.onclick=()=>{const on=x.hasAttribute('hidden');if(on)x.removeAttribute('hidden');else x.setAttribute('hidden','');b.setAttribute('aria-pressed',on);};}
function meterRows(rows){return rows.map(([n,s,p])=>{const col=p>=85?'--good':p>=60?'--warn':'--crit';
 return `<div class="metarow"><div class="metaname"><b>${n}</b><br><span class="hint">${s}</span></div><div class="bar"><span style="width:${Math.max(2,Math.min(100,p)).toFixed(0)}%;background:var(${col})"></span></div><div class="pctv" style="color:var(${col})">${p.toFixed(0)}%</div></div>`;}).join('');}
function naMsg(txt){return `<div class="na">${txt}</div>`;}
// Insights breves por sección: fortalezas (good) y a mejorar (bad)
function insBox(good,bad){
 const G=(good||[]).map(t=>`<li>${t}</li>`).join('')||'<li>Sin señales destacadas en el periodo.</li>';
 const B=(bad||[]).map(t=>`<li>${t}</li>`).join('')||'<li>Sin falencias relevantes detectadas.</li>';
 return `<div class="grid k2 sec ins"><div class="card insg"><div class="inshd">✓ Fortalezas</div><ul>${G}</ul></div>`+
        `<div class="card insb"><div class="inshd">▲ A mejorar</div><ul>${B}</ul></div></div>`;}

// ================= INFORME SALUBRISTA (APS rural) =================
const RURAL='La red de Tongoy (comuna de Coquimbo) es una zona costera rural: el CESFAM Tongoy y su posta rural PSR Guanaqueros conforman la atención primaria, mientras el SUR Tongoy resuelve la urgencia. Hay población dispersa, dependencia de la red y una marcada estacionalidad estival (aumento de población flotante en verano).';
function H3(t){return `<h3 style="font-size:13.5px;font-weight:800;margin:16px 0 5px;color:var(--ink)">${t}</h3>`;}
function P(t){return `<p style="margin:0 0 8px;color:var(--ink2)">${t}</p>`;}
function RECS(arr){return H3('Recomendaciones')+'<ul style="margin:4px 0 8px;padding-left:18px;color:var(--ink2)">'+arr.map(x=>`<li style="margin-bottom:5px">${x}</li>`).join('')+'</ul>';}
function NOTE(t){return `<p style="margin-top:14px;padding:10px 12px;background:var(--surf2);border-left:3px solid var(--s4);border-radius:8px;font-size:12px;color:var(--mut)">${t}</p>`;}
function cierre(indKey){const d=dev();const y=d.yoy&&d.yoy[indKey];if(!y)return null;
 const li=lastIdx(y.y_cur);const real=sum(y.y_cur.filter(x=>x!=null));const proj=sum(y.fc.slice(li+1).filter(x=>x!=null));
 const full=real+proj;const f25=sum(y.y_prev);return {real,proj,full,f25,pct:f25?((full-f25)/f25*100):0,li};}
function money(n){return nf.format(Math.round(n));}
function pctxt(p){return (p>=0?'+':'')+p.toFixed(0)+'%';}

function repHead(){return P(`<b>${CN[centro]}</b> · periodo enero–septiembre 2026 (poblaciones bajo control al corte disponible). ${RURAL}`);}

function repResumen(){const d=dev();if(isSUR())return repProd();
 const c=cierre('Producción total');
 let alertM=0;LB.forEach((_,i)=>{if(Object.keys(D.epi_umbrales).some(k=>{const x=d.epi[k][i];return x!=null&&x>D.epi_umbrales[k];}))alertM++;});
 const p=d.pscv;const hta=p.hta_bc?p.hta_comp/p.hta_bc*100:0;
 const ab=sum(d.ccr.Egresos)?sum(d.ccr.Abandono)/sum(d.ccr.Egresos)*100:0;
 let h=repHead();
 h+=H3('Situación actual')+P(`En lo que va de 2026 la red acumula <b>${money(sum(d.prod_total))}</b> atenciones. La vigilancia epidemiológica registró alerta en <b>${alertM} de ${LB.length}</b> meses. En el programa cardiovascular la compensación de hipertensos alcanza <b>${hta.toFixed(0)}%</b> (meta ${D.pscv_metas.HTA}%), y en rehabilitación el abandono se ubica en <b>${ab.toFixed(0)}%</b>.`);
 h+=H3('Lectura salubrista')+P(`El volumen de actividad es consistente con una APS rural resolutiva; sin embargo, conviene leer los indicadores por separado más que como un agregado. ${hta<D.pscv_metas.HTA?'La compensación cardiovascular por debajo de meta y ':''}${ab>15?'un abandono elevado en rehabilitación ':''}son señales que, en contexto de dispersión geográfica y dificultades de traslado, suelen reflejar barreras de acceso y continuidad más que falta de oferta.`);
 if(c)h+=H3('Proyección')+P(`Si se mantiene el patrón estacional, el cierre 2026 de producción rondaría <b>${money(c.full)}</b> atenciones (${pctxt(c.pct)} respecto de 2025).`);
 h+=RECS(['Priorizar los módulos en rojo/ámbar del tablero para la próxima reunión de equipo, partiendo por el de mayor impacto poblacional.','Reforzar la continuidad de cuidados de las personas bajo control (recordatorios, rescate telefónico y rondas a Guanaqueros) antes del alza estival de demanda.','Anticipar la temporada respiratoria de invierno con campaña y stock, usando el semáforo epidemiológico como disparador.']);
 h+=NOTE('Vista de resumen; cada módulo tiene su propio informe con el detalle. El SUR Tongoy participa solo en urgencia.');
 return h;}

function repProd(){const d=dev();
 if(isSUR()){let h=repHead();h+=H3('Situación actual')+P(`El SUR Tongoy acumula <b>${money(sum(d.prod_total))}</b> atenciones de urgencia (ene–sep 2026).`);
  h+=H3('Lectura salubrista')+P('En un balneario rural, la urgencia amortigua la variabilidad estacional: conviene vigilar los meses de verano, cuando la población flotante eleva la demanda, y la coherencia entre la categorización (triage) y las atenciones registradas.');
  h+=RECS(['Revisar el descuadre entre triage y atenciones por profesional para asegurar calidad del dato.','Planificar refuerzo de turnos para el peak estival.']);return h;}
 const c=cierre('Producción total');const lead=Object.entries(d.estamentos).map(([k,v])=>[k,sum(v)]).sort((a,b)=>b[1]-a[1])[0];
 const pap=sum(d.extra['PAP tomados']),emp=sum(d.extra['EMP realizados']);const cob=centro==='consolidado';
 let h=repHead();

 h+=H3('Lectura salubrista')+P(`La educación individual es fuerte, pero ${grupal<consej*0.1?'la educación grupal aparece baja: es una oportunidad, porque los talleres rinden mucho por hora-profesional y construyen comunidad':'el balance individual/grupal es adecuado'}. ${social===0?'La participación social formal (consejos, cuentas públicas, diálogos) no registra actividad en el periodo, algo a revisar: en el mundo rural la participación de la comunidad es un determinante directo de la pertinencia y la confianza en el centro.':'La participación social registra actividad, lo que fortalece el vínculo con la comunidad.'} Los reclamos, más que un problema, son información para mejorar el trato y el acceso.`);
 h+=RECS(['Potenciar la educación grupal (talleres por ciclo vital y área temática) como complemento de la consejería individual.','Reactivar y registrar las instancias de participación social (consejo de desarrollo, cuentas públicas, diálogos ciudadanos), clave para la pertinencia rural.','Cerrar el ciclo de los reclamos OIRS con respuesta oportuna y mejora visible; comunicar los cambios a la comunidad.']);
 h+=NOTE('Participación desde A19b (OIRS, participación social, satisfacción) y Educación desde A19a (consejerías) y A27 (educación grupal).');
 return h;}
function repSP(){const key=centro==='201178'?null:(centro==='consolidado'?'consolidado':centro);
 if(!key)return P('La Serie P es de APS; no aplica a la urgencia.');
 const sm=SP.prog['Salud mental'][key],pm=SP.prog['Personas mayores'][key],cv=SP.prog['PSCV'][key];
 let h=repHead();
 h+=H3('Situación actual')+P(`Entre los cortes de diciembre 2024 y junio 2026, la población bajo control evolucionó así: Salud Mental ${money(sm[0])}→${money(sm[2])}, Personas Mayores ${money(pm[0])}→${money(pm[2])}, PSCV ${money(cv[0])}→${money(cv[2])}. La comparación mezcla cortes de diciembre (2024, 2025) con uno de junio (2026).`);
 h+=H3('Lectura salubrista')+P(`El seguimiento interanual de la Serie P muestra la carga crónica del centro y hacia dónde crece. ${sm[2]>sm[1]?'El alza sostenida en salud mental es la señal más fuerte y exige capacidad instalada (horas, teleconsultoría, consultoría).':''} ${pm[2]>pm[1]?'El crecimiento en personas mayores refleja el envejecimiento local y demanda más cuidado domiciliario y manejo de dependencia.':''} En una red rural, cada persona bajo control implica continuidad en el tiempo: el desafío no es solo captar, sino no perder el seguimiento.`);
 h+=RECS(['Planificar las horas de los programas crónicos según la progresión real de la Serie P, no solo la demanda espontánea.','Estandarizar el corte comparado (usar diciembre con diciembre) para lecturas interanuales limpias.','Anticipar el crecimiento de salud mental y personas mayores con estrategias de continuidad (rescate, domiciliario, telesalud).']);
 h+=NOTE('Serie P (P1/P2/P4/P5/P6/P9/P13), cortes dic-2024, dic-2025 y jun-2026. 2026 es corte de mitad de año.');
 return h;}

const REPORT={resumen:repResumen,prod:repProd,cv:repCV,pie:repPie,resp:repResp,sm:repSM,ccr:repCCR,chcc:repChCC,pacom:repPacom,cob:repCob,proy:repProy,adol:repAdol,dent:repDent,part:repPart,sp:repSP};

/* ======================================================================
   "Explícame esto" — lectura en lenguaje simple para TODO el equipo
   (administrativos, auxiliares, guardias, conductores, y cualquiera).
   Analogía breve + datos en palabras llanas + el rol de cada persona.
   ====================================================================== */
function simHead(){return `<p style="margin:0 0 2px;color:var(--mut);font-size:12.5px">Estás viendo <b style="color:var(--ink)">${CN[centro]}</b> · de enero a septiembre de 2026.</p>`;}
function STORY(t){return `<div style="margin:6px 0 14px;padding:13px 15px;background:color-mix(in srgb,var(--s4) 13%,var(--surf2));border-left:4px solid var(--s4);border-radius:11px;color:var(--ink);font-size:13.5px;line-height:1.62"><span style="font-size:15px">💡 </span>${t}</div>`;}
function SEC(ic,t){return `<h3 style="font-size:14px;font-weight:800;margin:17px 0 6px;color:var(--ink);display:flex;align-items:center;gap:8px"><span style="font-size:16px">${ic}</span>${t}</h3>`;}
function TX(t){return `<p style="margin:0 0 9px;color:var(--ink2);font-size:13.5px;line-height:1.65">${t}</p>`;}
function BIG(v,l){return `<div style="display:flex;align-items:baseline;gap:10px;margin:5px 0 10px;padding:11px 15px;background:var(--surf2);border:1px solid var(--line);border-radius:12px"><span style="font-family:'Space Grotesk','Inter',sans-serif;font-size:27px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums">${v}</span><span style="color:var(--ink2);font-size:13px;line-height:1.35">${l}</span></div>`;}
function ROLE(t){return `<div style="margin:15px 0 2px;padding:13px 15px;background:color-mix(in srgb,var(--s3) 14%,var(--surf2));border-left:4px solid var(--s3);border-radius:11px"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--s3);margin-bottom:5px">🤝 Aquí entra todo el equipo</div><div style="color:var(--ink);font-size:13.5px;line-height:1.62">${t}</div></div>`;}
const simN=x=>money(sum(x||[]));

function simResumen(){const d=dev();if(isSUR())return simProd();
 const p=d.pscv||{};const hta=p.hta_bc?Math.round(p.hta_comp/p.hta_bc*100):0;
 let h=simHead();
 h+=STORY('Imagina este tablero como el <b>panel de un auto</b>: no reemplaza al mecánico, pero de un vistazo dice si vamos bien, si hay una luz encendida o si conviene detenerse a revisar. Cada sección es un indicador distinto de la salud de nuestra comunidad.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('Un resumen del trabajo del CESFAM Tongoy y la posta de Guanaqueros en lo que va del año: cuántas personas atendimos, cómo van los programas de enfermos crónicos, los niños, la salud mental y la vigilancia de las enfermedades de invierno.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(sum(d.prod_total)),'atenciones entregadas en lo que va del año')+TX(`Es muchísimo trabajo para un equipo pequeño en una zona rural. Por ejemplo, en el cuidado de la presión alta <b>${hta} de cada 100</b> personas tienen su enfermedad controlada.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Cada número de este tablero es una persona de nuestra comunidad: un vecino de la caleta, un adulto mayor, un niño. El tablero nos ayuda a ver a quién estamos llegando y a quién todavía nos falta llegar.');
 h+=ROLE('Que la posta funcione no depende solo de médicos y enfermeras. El guardia que orienta a quien llega perdido, el conductor que lleva al equipo a una ronda en Guanaqueros, quien mantiene limpio el box, quien contesta el teléfono y agenda una hora: <b>todos hacen posible cada una de estas atenciones</b>. Este tablero también cuenta tu trabajo.');
 return h;}

function simProd(){const d=dev();let h=simHead();
 if(isSUR()){
  h+=STORY('La urgencia (SUR) es como la <b>posta de bomberos</b> de la salud: está lista para lo que no puede esperar. En un balneario, en verano llega mucha más gente, y el equipo tiene que estar preparado.');
  h+=SEC('👀','¿Qué estoy viendo?')+TX('El trabajo del Servicio de Urgencia Rural (SUR) de Tongoy: las atenciones de personas que llegaron con algo que no podía esperar al día siguiente.');
  h+=SEC('📊','¿Cómo vamos?')+BIG(money(sum(d.prod_total)),'atenciones de urgencia en el año')+TX('La urgencia no se planifica: responde a lo que va llegando. Por eso los meses de verano, con más visitantes, suelen ser los más cargados.');
  h+=SEC('❤️','¿Por qué importa?')+TX('En una zona alejada, tener urgencia cerca significa que una persona no tiene que viajar hora y media a La Serena para ser atendida de algo grave. Eso salva vidas.');
  h+=ROLE('En la urgencia, los segundos cuentan: el guardia que recibe y ordena la llegada, el conductor de la ambulancia, quien ubica rápido una ficha o un teléfono de un familiar, son parte directa de la cadena que atiende al que llega mal.');
  return h;}
 const lead=Object.entries(d.estamentos).map(([k,v])=>[k,sum(v)]).sort((a,b)=>b[1]-a[1])[0];
 h+=STORY('Piensa en la "producción" como el <b>registro de una cocina</b>: anota cuántos platos se sirvieron, por quién y a quiénes. No mide lo rico que quedó, pero muestra cuánto se trabajó y si alcanzamos para todos.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('La cantidad de atenciones y controles que hizo el equipo: consultas médicas, de enfermería, matrona, dental, etc. Es la foto del "cuánto trabajamos".');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(sum(d.prod_total)),'atenciones en total')+TX(`El grupo que más atenciones realizó fue <b>${lead[0]}</b>. El tablero también separa por edades, para ver si estamos llegando a niños, adultos y personas mayores.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Saber cuánto y a quién atendemos ayuda a repartir mejor las horas, los días de ronda y los recursos. En el campo, llegar a quien vive lejos cuesta más, y eso hay que planificarlo.');
 h+=ROLE('Cada atención que ves aquí empezó antes de llegar al box: alguien agendó la hora, preparó la ficha, ordenó la sala, cuidó la entrada. Sin ese soporte, el equipo clínico no podría atender a nadie.');
 return h;}

function simCV(){if(isSUR())return simRedir('el cuidado de los enfermos crónicos');
 const p=dev().pscv||{};const cm=dev().cvmon||{};
 const hta=p.hta_bc?Math.round(p.hta_comp/p.hta_bc*100):0;
 let h=simHead();
 h+=STORY('Cuidar la presión alta y la diabetes es como <b>mantener un auto al día</b>: con revisiones periódicas anda bien por años; si se abandona, un día falla en la carretera. El objetivo es que nadie "quede botado".');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El programa cardiovascular (lo verás como <b>PSCV</b>) cuida a las personas con presión alta, diabetes o colesterol alto. Son enfermedades que no se sienten hasta que avanzan, por eso necesitan control constante.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(p.pscv_total||0),'personas en control de sus enfermedades crónicas')+TX(`De las personas con presión alta, <b>${hta} de cada 100</b> la tienen bien controlada. Además, con los exámenes preventivos (los "chequeos de salud") el equipo detecta a tiempo a quienes recién empiezan a tener problemas: este año ${cm.emp?('se hicieron <b>'+simN(cm.emp)+'</b> chequeos'):'se realizaron chequeos preventivos'}.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Una presión o un azúcar descontrolados terminan en infartos, derrames o amputaciones. Controlarlos a tiempo, aquí en la posta, evita viajes a especialistas, hospitalizaciones y mucho sufrimiento evitable.');
 h+=ROLE('El control sirve solo si la persona llega. El recordatorio por teléfono, el transporte a la ronda de Guanaqueros, una buena orientación al llegar o que no se pierda su hora: todo eso decide si un vecino sigue su tratamiento o lo abandona.');
 return h;}

function simPie(){if(isSUR())return simRedir('la revisión de los pies en personas con diabetes');
 const pd=PD.d[centro],i=PD.corte.length-1;
 const dm=pd.dm2_pbc[i],ev=pd.ev[i],cob=dm?Math.round(ev/dm*100):0,alto=(pd.alto[i]||0)+(pd.max[i]||0);
 let h=simHead();
 h+=STORY('Revisar el pie de una persona con diabetes es como <b>mirar los neumáticos antes de un viaje largo</b>: una pequeña herida que no se siente puede, con el tiempo, dejar a alguien "en pana". Detectarla temprano lo cambia todo.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('La diabetes puede hacer que la persona <b>deje de sentir</b> sus pies. Así, una ampolla o una herida pequeña pasa desapercibida, se infecta y, en el peor caso, lleva a perder el pie. Por eso el equipo revisa los pies uno por uno.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(cob+'%',`de las personas con diabetes ya tiene su pie revisado (corte ${PD.corte[i]})`)+TX(`De las revisadas, <b>${money(alto)}</b> tienen riesgo alto y necesitan cuidado especial. Esa es la lista a la que hay que seguir de cerca.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Una amputación le cambia la vida a una persona para siempre y casi siempre se puede evitar. En un lugar rural, donde ir al especialista cuesta tiempo y plata, revisar el pie aquí mismo es de lo más valioso que hacemos.');
 h+=ROLE('Que la persona de riesgo alto no falte a su curación o a podología depende mucho del rescate telefónico y del traslado. Un llamado a tiempo o un cupo en el móvil pueden, literalmente, salvar un pie.');
 return h;}

function simResp(){if(isSUR())return simRedir('la vigilancia de las enfermedades de invierno');
 const d=dev();const iraTot=sum(d.epi['IRA Alta']);
 let h=simHead();
 h+=STORY('Esta sección es como <b>mirar el cielo antes de que llueva</b>: vigila los resfríos, bronquitis y neumonías para preparar al equipo <i>antes</i> de que llegue la ola de invierno, no cuando ya está encima.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El seguimiento de las enfermedades respiratorias (resfríos fuertes, bronquitis, neumonías). El tablero usa un <b>semáforo</b>: cuando un mes se pone en rojo, es que hubo más casos de lo normal.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(iraTot),'casos de infección respiratoria alta en el año')+TX('El peak siempre es en invierno (junio a agosto). Ver venir el alza permite preparar oxígeno, medicamentos y horas de atención con tiempo.');
 h+=SEC('❤️','¿Por qué importa?')+TX('Una neumonía a tiempo se trata en la posta; tarde, puede terminar en el hospital o ser mortal, sobre todo en adultos mayores y guaguas. Anticiparse evita que la red se sature justo cuando más se necesita.');
 h+=ROLE('En temporada alta, mantener las salas ventiladas y limpias, ordenar la espera para que los más enfermos no se contagien entre sí, y tener el móvil listo para un traslado urgente, es parte del cuidado respiratorio tanto como el remedio.');
 return h;}

function simSM(){if(isSUR())return simRedir('el programa de salud mental');
 const sm=dev().salud_mental||{};const ing=sum(sm.Ingresos);
 let h=simHead();
 h+=STORY('La salud mental es como la <b>salud de una casa por dentro</b>: no se ve desde la calle, pero sostiene todo lo demás. Pedir ayuda a tiempo evita que una gotera se vuelva un derrumbe.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El programa que acompaña a personas con depresión, ansiedad, consumo de alcohol o drogas, y otras dificultades. "Ingreso" significa que una persona empezó a recibir ayuda; "egreso", que terminó bien su tratamiento o avanzó.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(ing),'personas ingresaron a recibir apoyo en salud mental')+TX('La demanda de salud mental viene creciendo en todo Chile, y en zonas rurales el aislamiento la hace aún más importante de atender.');
 h+=SEC('❤️','¿Por qué importa?')+TX('Detrás de cada ingreso hay alguien que se atrevió a pedir ayuda. Que encuentre una puerta abierta y un trato digno puede marcar la diferencia entre mejorar o quedarse solo con el problema.');
 h+=ROLE('La salud mental se cuida con el <b>trato</b> de todos. Una palabra amable en la entrada, discreción con lo que se escucha, paciencia con quien está angustiado: cualquier persona del equipo puede hacer que alguien se sienta acogido o, al revés, que no vuelva.');
 return h;}

function simCCR(){if(isSUR())return simRedir('la rehabilitación (kinesiología y terapia)');
 const c=dev().ccr||{};const ses=sum(c.Sesiones),ing=sum(c.Ingresos);
 let h=simHead();
 h+=STORY('La rehabilitación es como <b>aprender a caminar de nuevo tras un tropiezo</b>: con ayuda y constancia, una persona recupera movimiento, independencia y ganas. Pero cada sesión perdida es un paso atrás.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El trabajo del equipo de rehabilitación (kinesiólogos, terapeutas) con personas que tienen dolor, problemas para moverse o se recuperan de una lesión. "Sesiones" son las veces que vinieron a tratarse.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(ses),'sesiones de rehabilitación realizadas')+TX(`Ingresaron <b>${money(ing)}</b> personas al programa. La clave en rehabilitación es la constancia: los resultados llegan sesión a sesión.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Recuperar el movimiento le permite a un adulto mayor seguir valiéndose solo, y a un trabajador volver a su pega. Es calidad de vida que se gana con tiempo y cercanía.');
 h+=ROLE('En el campo, el principal motivo para abandonar la rehabilitación es <b>no tener cómo llegar</b>. El transporte a las sesiones y un recordatorio para no faltar son, muchas veces, lo que decide si una persona se recupera o se queda a medio camino.');
 return h;}

function simChCC(){if(isSUR()||!dev().dsm)return simRedir('el acompañamiento del desarrollo de los niños');
 const d=dev().dsm;const test=sum(d.test_aplic);
 let h=simHead();
 h+=STORY('Acompañar el desarrollo de un niño es como <b>cuidar una planta nueva</b>: si se riega y se le pone atención a tiempo, crece fuerte. Detectar temprano una dificultad permite corregir el rumbo cuando es más fácil.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('"Chile Crece Contigo" acompaña a los niños desde que nacen. El equipo les hace evaluaciones (juegos y pruebas simples) para ver si están desarrollándose bien en su forma de moverse, hablar y relacionarse.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(test),'evaluaciones del desarrollo infantil realizadas')+TX('Cuando se detecta un retraso, el niño pasa a la Sala de Estimulación, donde se trabaja para que se ponga al día. Encontrar algo no es mala noticia: es la prueba de que la pesquisa funciona.');
 h+=SEC('❤️','¿Por qué importa?')+TX('Los primeros años dejan huella para toda la vida. Apoyar a tiempo a un niño con dificultades es una de las cosas de mayor impacto que puede hacer una posta.');
 h+=ROLE('Una sala de espera amigable para las familias, paciencia con las guaguas que lloran, ayudar a una mamá que viene de lejos con el coche y los hermanos: todo eso hace que las familias vuelvan a los controles del niño sano en vez de dejarlos.');
 return h;}

function simPacom(){if(isSUR()||!dev().programas)return simRedir('los programas que llevan la salud a la casa');
 const sm=dev().salud_mental||{};const ing=sum(sm.Ingresos);
 const pa=(dev().programas&&dev().programas.PASMI)||{};const vis=sum(pa['Niños/as visitados']);

 h+=SEC('👀','¿Qué estoy viendo?')+TX('Programas de acompañamiento: el equipo de salud mental y el apoyo a la primera infancia que trabajan con visitas a domicilio, llamados telefónicos y seguimiento cercano a las familias que más lo necesitan.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(ing),'ingresos de personas al apoyo de salud mental')+(vis?TX(`Y se hicieron visitas de seguimiento a <b>${money(vis)}</b> niños en sus propios establecimientos y hogares.`):TX('El trabajo de terreno y los llamados de seguimiento son el corazón de estos programas.'));
 h+=SEC('❤️','¿Por qué importa?')+TX('Hay personas que, por distancia, edad o su situación, nunca llegarían solas a la posta. Ir a buscarlas evita que queden abandonadas y que un problema pequeño se agrande.');
 h+=ROLE('El terreno no existe sin logística: el conductor que lleva al equipo a un sector apartado, quien coordina las visitas y ubica las direcciones, quien hace el llamado de seguimiento. Llevar la salud a la casa es, literalmente, un trabajo de equipo completo.');
 return h;}

function simCob(){if(isSUR())return simRedir('los exámenes preventivos');
 const d=dev();const pap=sum(d.extra['PAP tomados']),emp=sum(d.extra['EMP realizados']);
 let h=simHead();
 h+=STORY('Los exámenes preventivos son como la <b>revisión técnica del auto</b>: se hacen cuando todo "anda bien", justamente para descubrir a tiempo lo que todavía no da problemas. Es más barato y más fácil prevenir que reparar.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('Los chequeos que se hacen a personas <b>sanas</b> para pescar problemas temprano: el PAP (que previene el cáncer de cuello de útero en las mujeres) y el examen de medicina preventiva o EMP (un chequeo general de salud).');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(pap)+' + '+money(emp),'PAP y chequeos preventivos (EMP) realizados')+TX('Lo difícil de la prevención es que la persona sana no siente que necesita venir. Por eso cada chequeo logrado es un pequeño triunfo del equipo.');
 h+=SEC('❤️','¿Por qué importa?')+TX('Un cáncer o una diabetes descubiertos a tiempo se tratan mucho mejor y cuestan mucho menos dolor. La prevención es, de lejos, la mejor inversión en salud.');
 h+=ROLE('Convencer a alguien sano de venir a chequearse se gana con confianza en el centro. Un buen trato, una campaña bien difundida en la caleta, un cupo flexible para quien trabaja: así se capta a quien normalmente no consultaría.');
 return h;}

function simProy(){if(isSUR())return simRedir('las proyecciones a futuro');

 h+=SEC('👀','¿Qué estoy viendo?')+TX('Una estimación de hacia dónde van algunos programas, calculada con los datos de los años anteriores. Es una predicción con base en números, no una bola de cristal ni una meta oficial.');
 h+=SEC('📈','¿Cómo vamos?')+TX('El tablero compara año contra año y dibuja la tendencia: si un programa viene creciendo o bajando. Eso ayuda a anticipar cuántas horas y recursos harán falta el próximo año.');
 h+=SEC('❤️','¿Por qué importa?')+TX('Planificar con tiempo evita quedar cortos justo cuando la demanda sube. Es la diferencia entre reaccionar a los apurones o prepararse con calma.');
 h+=ROLE('Toda proyección se construye sobre datos bien registrados. Cada hora agendada correctamente, cada ficha en orden, cada dato bien anotado hoy es lo que permite que mañana el centro planifique sin adivinar.');
 return h;}

function simAdol(){const e=exd();if(isSUR()||!e)return simRedir('el programa de adolescentes');
 const ctrl=sum(e.adol_ctrl),ea=sum(e.adol_ea);
 let h=simHead();
 h+=STORY('Atender adolescentes es como <b>tenderles un puente</b>: a esa edad muchos no se atreven a pedir ayuda. Un espacio donde se sientan escuchados y sin juicios puede marcarles la vida.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El cuidado de los jóvenes, muchas veces en el "Espacio Amigable", un lugar pensado para que puedan hablar con confianza de temas difíciles: emociones, consumo, sexualidad, su cuerpo.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(ctrl),'controles de salud a adolescentes')+TX(`De ellos, <b>${money(ea)}</b> fueron en el Espacio Amigable. Que un joven entre por esa puerta suele ser la ocasión de pescar a tiempo un problema que no contaría en otro lado.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Lo que se previene en la adolescencia (consumo, embarazo no planificado, problemas de salud mental) evita daños que pesarían toda la vida. Es una edad clave para intervenir.');
 h+=ROLE('Un adolescente capta al instante si lo miran con desconfianza. Un trato respetuoso y reservado desde la entrada, sin preguntas incómodas delante de otros, es lo que hace que vuelva en vez de arrepentirse de haber venido.');
 return h;}

function simDent(){const e=exd();if(isSUR()||!e)return simRedir('la atención dental');
 const ctrl=sum(e.dent_ctrl),urg=sum(e.dent_urg);
 let h=simHead();
 h+=STORY('Cuidar los dientes es como <b>pintar la reja antes de que se oxide</b>: un control a tiempo es rápido y barato; esperar a que duela significa una urgencia, más dolor y, a veces, perder la pieza.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('El trabajo del equipo dental: los controles y tratamientos programados, y las urgencias (cuando alguien llega con dolor que no aguanta). Mientras más controles y menos urgencias, mejor vamos.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(ctrl),'controles dentales programados')+TX(`Además hubo <b>${money(urg)}</b> urgencias por dolor. En zonas rurales, la distancia hace que mucha gente solo venga cuando ya le duele; el desafío es adelantarse a eso.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Una boca sana es poder comer, hablar y sonreír sin dolor ni vergüenza. La salud dental impacta la autoestima, la nutrición y hasta la posibilidad de encontrar trabajo.');
 h+=ROLE('Llevar la educación en cepillado y flúor a las escuelas y a Guanaqueros, y recordar los controles, ayuda a que la gente llegue antes de que duela. Prevenir una urgencia dental empieza mucho antes del sillón.');
 return h;}

function simPart(){const e=exd();if(isSUR()||!e)return simRedir('la participación y educación de la comunidad');
 const consej=sum(e.edu_consej),recl=sum(e.par_reclamos),felic=sum(e.par_consultas);
 let h=simHead();
 h+=STORY('Esta sección es el <b>oído y la voz del centro con su comunidad</b>: escuchar lo que la gente necesita y enseñarle a cuidarse. Un centro que escucha es un centro en el que la gente confía.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('Dos cosas: la <b>educación</b> en salud (consejos y talleres para que la gente aprenda a cuidarse) y la <b>participación</b>, donde la comunidad opina, felicita o reclama a través de la oficina de atención (OIRS).');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(consej),'consejerías y educaciones de salud entregadas')+TX(`La comunidad también dejó <b>${money(recl)}</b> reclamos y <b>${money(felic)}</b> felicitaciones o sugerencias. Los reclamos no son un ataque: son información para mejorar.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Un centro que enseña y escucha logra que la gente se cuide mejor y confíe más. En el mundo rural, esa confianza es la base de todo lo demás.');
 h+=ROLE('La primera impresión de la comunidad la dan quienes reciben y orientan. Un buen trato en la entrada, escuchar un reclamo sin ponerse a la defensiva y encauzarlo bien: eso construye la confianza de todo el pueblo en su posta.');
 return h;}

function simSP(){if(isSUR())return simRedir('el seguimiento de las personas en control');
 let h=simHead();
 const sm=(SP.prog['Salud mental']&&SP.prog['Salud mental'][centro==='consolidado'?'consolidado':centro])||[0,0,0];
 const pm=(SP.prog['Personas mayores']&&SP.prog['Personas mayores'][centro==='consolidado'?'consolidado':centro])||[0,0,0];
 h+=STORY('Esta sección es como un <b>álbum de fotos tomadas cada cierto tiempo</b>: al comparar las fotos se ve cómo va creciendo la "familia" de personas que el centro cuida de forma permanente.');
 h+=SEC('👀','¿Qué estoy viendo?')+TX('Cuántas personas están bajo cuidado permanente del centro en distintos programas (crónicos, salud mental, personas mayores) y cómo ese número cambia con el tiempo. Son los pacientes que el centro acompaña mes a mes, no una atención de una sola vez.');
 h+=SEC('📊','¿Cómo vamos?')+BIG(money(pm[2]||0),'personas mayores bajo control del centro')+TX(`La lista de salud mental pasó de ${money(sm[0]||0)} a ${money(sm[2]||0)} personas entre los cortes. Cuando estas listas crecen, el equipo tiene que crecer con ellas para no perderle el seguimiento a nadie.`);
 h+=SEC('❤️','¿Por qué importa?')+TX('Cada persona en estas listas es alguien que volverá una y otra vez. El reto no es solo sumar gente, sino no perderla: que nadie deje de venir y quede sin control.');
 h+=ROLE('No perder a una persona del seguimiento es tarea de todos: el rescate telefónico de quien dejó de venir, el traslado para quien no puede llegar, mantener sus datos de contacto al día. Así la "familia" bajo cuidado no se desarma.');
 return h;}

function simRedir(tema){return simHead()+STORY(`Esta sección trata sobre <b>${tema}</b>, que corresponde al CESFAM y la posta (atención de personas sanas y con enfermedades de largo plazo), no a la urgencia (SUR).`)+TX('Para leer esta parte en simple, elige arriba <b>Consolidado</b>, <b>CESFAM</b> o <b>PSR</b> en lugar de SUR.');}

// ===== Ampliar gráfico a pantalla completa =====
function resizeAll(){Object.values(charts).forEach(c=>{try{c.resize();}catch(e){}});}
let expState=null;
function openExp(box){
 if(expState)return;
 const card=box.closest('.card'); const h=card?card.querySelector('h2,h3'):null;
 $('#expTitle').textContent=h?h.textContent:'Gráfico';
 const ph=el('div'); ph.style.display='none'; // placeholder para devolverlo a su lugar
 box.parentNode.insertBefore(ph,box);
 expState={box,ph, h:box.style.height};
 box.style.height='100%';
 $('#expHost').appendChild(box); $('#expOv').removeAttribute('hidden');
 setTimeout(resizeAll,60);
}
function closeExp(){
 if(!expState)return; const {box,ph,h}=expState;
 box.style.height=h||''; ph.parentNode.insertBefore(box,ph); ph.remove();
 $('#expOv').setAttribute('hidden',''); expState=null; setTimeout(resizeAll,60);
}
function wireExpand(){
 document.querySelectorAll('.content .chartbox').forEach(box=>{
  if(box.querySelector(':scope > .expbtn'))return;
  const b=el('button','expbtn','⤢'); b.title='Ampliar'; b.setAttribute('aria-label','Ampliar gráfico');
  b.onclick=()=>openExp(box); box.appendChild(b);
 });
}
$('#expClose').onclick=closeExp;
$('#expOv').onclick=e=>{if(e.target===$('#expOv'))closeExp();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeExp();$('#repOv').setAttribute('hidden','');$('#simOv').setAttribute('hidden','');}});
new MutationObserver(()=>{wireExpand();}).observe($('.content'),{childList:true,subtree:true});
activate('resumen');
setTimeout(wireExpand,120);
