<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Control PASMI · CESFAM Tongoy</title>
<style>
:root{
  --petroleo:#0f3b44; --petroleo-2:#14525e; --petroleo-3:#1a6675;
  --teal:#1f8a99; --teal-2:#2aa5b5; --teal-soft:#d7eef1;
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f7fafa; --line:#dde5e7;
  --txt:#13272c; --txt-soft:#4a6269; --txt-inv:#eaf4f5;
  --verde:#2e9e6b; --verde-bg:#e4f4ec;
  --amarillo:#d99311; --amarillo-bg:#faf0d9;
  --rojo:#d1495b; --rojo-bg:#f9e3e6;
  --gris:#8a9aa0; --gris-bg:#eceff0;
  --shadow:0 1px 3px rgba(15,59,68,.08),0 4px 16px rgba(15,59,68,.06);
  --radius:14px; --radius-s:9px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --petroleo:#0a1e22; --petroleo-2:#0f2d33; --petroleo-3:#164049;
  --teal:#2aa5b5; --teal-2:#3cc0d0; --teal-soft:#13353b;
  --bg:#0a1a1d; --surface:#10282d; --surface-2:#0d2226; --line:#1d3b41;
  --txt:#dbe9eb; --txt-soft:#90a7ac; --txt-inv:#eaf4f5;
  --verde:#43b67f; --verde-bg:#12302a;
  --amarillo:#e6ad3c; --amarillo-bg:#33280f;
  --rojo:#e4677a; --rojo-bg:#361a20;
  --gris:#7e9197; --gris-bg:#17292d;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--teal)}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:232px;flex:0 0 232px;background:linear-gradient(180deg,var(--petroleo),var(--petroleo-2));color:var(--txt-inv);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal-2),var(--teal));display:grid;place-items:center;font-size:19px;flex:0 0 34px}
.brand .t1{font-size:14.5px;font-weight:700;line-height:1.15}
.brand .t2{font-size:11px;opacity:.72;margin-top:2px}
.nav{padding:10px 10px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--txt-inv);padding:10px 12px;border-radius:9px;font-size:13.7px;text-align:left;opacity:.82;margin-bottom:2px}
.nav button .ic{font-size:16px;width:20px;text-align:center;opacity:.9}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button.active{background:rgba(42,165,181,.22);opacity:1;font-weight:650;box-shadow:inset 3px 0 0 var(--teal-2)}
.side-foot{padding:12px 16px;font-size:10.5px;opacity:.6;border-top:1px solid rgba(255,255,255,.1)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar .ttl{font-size:16px;font-weight:700}
.topbar .sub{font-size:11.5px;color:var(--txt-soft)}
.spacer{flex:1}
.badge{font-size:10.5px;padding:4px 9px;border-radius:20px;background:var(--teal-soft);color:var(--teal);font-weight:650;border:1px solid transparent}
.badge.lock{background:var(--verde-bg);color:var(--verde)}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--txt);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600}
.tool:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- Filtros ---------- */
.filters{background:var(--surface-2);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-soft);font-weight:650}
.fg select,.fg input{border:1px solid var(--line);background:var(--surface);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--txt-soft);font-weight:600;user-select:none}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.filters .reset{font-size:11.5px;color:var(--txt-soft);background:none;border:0;text-decoration:underline}

/* ---------- Content ---------- */
.content{padding:22px;flex:1}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-h{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px}
.section-h h2{font-size:17px}
.section-h .hint{font-size:12px;color:var(--txt-soft)}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card h3{font-size:13.5px;color:var(--txt-soft);font-weight:650;text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* KPI cards */
.kpis{grid-template-columns:repeat(auto-fit,minmax(192px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--txt-soft);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:720;letter-spacing:-.02em;margin:6px 0 2px;line-height:1}
.kpi .val small{font-size:15px;font-weight:600;color:var(--txt-soft)}
.kpi .meta{font-size:11.5px;color:var(--txt-soft)}
.kpi .bar{height:6px;border-radius:4px;background:var(--gris-bg);margin-top:11px;overflow:hidden}
.kpi .bar > i{display:block;height:100%;border-radius:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.sem-verde{color:var(--verde)} .bg-verde{background:var(--verde)} .dot.verde{background:var(--verde)}
.sem-amarillo{color:var(--amarillo)} .bg-amarillo{background:var(--amarillo)} .dot.amarillo{background:var(--amarillo)}
.sem-rojo{color:var(--rojo)} .bg-rojo{background:var(--rojo)} .dot.rojo{background:var(--rojo)}
.sem-gris{color:var(--gris)} .bg-gris{background:var(--gris)} .dot.gris{background:var(--gris)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.pill.verde{background:var(--verde-bg);color:var(--verde)}
.pill.amarillo{background:var(--amarillo-bg);color:var(--amarillo)}
.pill.rojo{background:var(--rojo-bg);color:var(--rojo)}
.pill.gris{background:var(--gris-bg);color:var(--gris)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--txt-soft);font-weight:650;position:sticky;top:0;background:var(--surface)}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-s)}
.mono{font-variant-numeric:tabular-nums}
code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--teal)}

/* editable inputs in config */
.inp{border:1px solid var(--line);background:var(--surface);color:var(--txt);border-radius:7px;padding:5px 8px;font-size:13px;width:92px;font-variant-numeric:tabular-nums;font-family:inherit}
.note{background:var(--teal-soft);border-left:3px solid var(--teal);padding:11px 14px;border-radius:8px;font-size:12.5px;color:var(--txt);margin-bottom:14px}
.note.warn{background:var(--amarillo-bg);border-color:var(--amarillo)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt-soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.svgchart{width:100%;height:auto;display:block;overflow:visible}
.svgchart text{font-family:var(--font);fill:var(--txt-soft)}
.bar-rect{transition:opacity .15s} .bar-rect:hover{opacity:.78}
.muted{color:var(--txt-soft)}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--txt-soft);padding:6px 11px;font-size:12px;font-weight:600}
.seg button.on{background:var(--teal);color:#fff}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--txt-soft)}
@media(max-width:860px){
  .side{position:fixed;left:-240px;z-index:60;transition:left .2s} .side.open{left:0}
  .app{display:block} .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">
        <div class="mark">🧒</div>
        <div><div class="t1">Centro de Control PASMI</div><div class="t2">CESFAM Tongoy · Región de Coquimbo</div></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="tool menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div><div class="ttl" id="viewTitle">Panel ejecutivo</div><div class="sub" id="viewSub"></div></div>
      <div class="spacer"></div>
      <span class="badge lock" title="Datos des-identificados: sin nombre, documento ni diagnóstico por caso; profesionales pseudonimizados.">🔒 Datos des-identificados</span>
      <button class="tool" onclick="toggleTheme()" id="themeBtn">🌓 Tema</button>
      <label class="tool" title="Cargar un JSON de datos PASMI">📂 Cargar<input type="file" accept="application/json" style="display:none" onchange="cargarJSON(event)"></label>
      <button class="tool" onclick="guardarJSON()" title="Descargar el estado actual (datos + metas editadas)">💾 Guardar</button>
    </div>

    <div class="filters" id="filters"></div>
    <div class="content" id="content"></div>
  </div>
</div>

let DATA = EMBEDDED;

/* ============ ESTADO / FILTROS ============ */
const state = {
  view:'panel',
  theme:'light',
  f:{ centros:['TONGOY','GUANAQUEROS'], bandas:['0-4','5-9'], mesDesde:null, mesHasta:null, sexo:'TODOS' }
};
const MESES_ALL = ()=>{ const s=new Set(); DATA.atenciones.forEach(a=>a.mes&&s.add(a.mes)); return [...s].sort(); };

/* ============ UTILES ============ */
const fmt = n => (n==null||isNaN(n))?'—':Number(n).toLocaleString('es-CL');
const pct = (n,d)=> d? (100*n/d):0;
const el = (t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e;};
const CATL = ()=>DATA.catLabels;

function semColor(valor, meta, inverso=false){
  if(valor==null||meta==null) return 'gris';
  const r = valor/meta;
  if(inverso){ if(valor<=meta) return 'verde'; if(valor<=meta*1.3) return 'amarillo'; return 'rojo'; }
  if(r>=1) return 'verde';
  if(r>=0.7) return 'amarillo';
  return 'rojo';
}

/* ============ FILTRADO ============ */
function pasa(a){
  if(state.f.centros.length && !state.f.centros.includes(a.centro)) return false;
  if(state.f.bandas.length && !state.f.bandas.includes(a.banda)) return false;
  if(state.f.sexo!=='TODOS' && a.sexo!==state.f.sexo) return false;
  if(state.f.mesDesde && (!a.mes || a.mes<state.f.mesDesde)) return false;
  if(state.f.mesHasta && (!a.mes || a.mes>state.f.mesHasta)) return false;
  return true;
}
function atsFiltradas(){ return DATA.atenciones.filter(pasa); }

function rollupCasos(ats){
  const m={};
  for(const a of ats){
    let c=m[a.caso]||(m[a.caso]={caso:a.caso,edades:[],sexo:a.sexo,centros:new Set(),sectors:new Set(),meses:new Set(),cats:{},profs:new Set(),fechas:[]});
    if(a.edad!=null)c.edades.push(a.edad);
    if(a.centro!=='SD')c.centros.add(a.centro);
    if(a.sector)c.sectors.add(a.sector);
    if(a.mes)c.meses.add(a.mes);
    c.cats[a.cat]=(c.cats[a.cat]||0)+a.cant;
    c.profs.add(a.prof);
    if(a.fecha)c.fechas.push(a.fecha);
  }
  return Object.values(m).map(c=>{
    const ing=(c.cats.ingreso||0)+(c.cats.ingreso_dx||0);
    const alta=c.cats.egreso_alta||0, aband=c.cats.egreso_abandono||0;
    const controles=(c.cats.control_sm||0)+(c.cats.control_sm_remoto||0);
    const clin=controles+(c.cats.edi||0)+(c.cats.consulta_sm||0)+(c.cats.consulta_ts||0)+ing+(c.cats.pci||0);
    let estado = aband?'egresado_abandono':alta?'egresado_alta':ing?'ingresado':'sin_ingreso_formal';
    c.fechas.sort();
    return {caso:c.caso, edad:c.edades.length?Math.max(...c.edades):null,
      banda:c.edades.length?banda(Math.max(...c.edades)):'SD', sexo:c.sexo,
      centro:[...c.centros][0]||'SD', sector:[...c.sectors][0]||null, estado,
      nAt:Object.values(c.cats).reduce((s,v)=>s+v,0), nControles:controles,
      nClin:clin, tieneEDI:(c.cats.edi||0)>0, tieneIngreso:ing>0, nProf:c.profs.size,
      primera:c.fechas[0]||null, ultima:c.fechas[c.fechas.length-1]||null, nMeses:c.meses.size};
  });
}
function banda(e){ return e==null?'SD':e<=4?'0-4':e<=9?'5-9':'10+'; }
const esEgresado = e => e==='egresado_alta'||e==='egresado_abandono';
const bajoControl = c => !esEgresado(c.estado) && c.nClin>0;

function catCount(ats,cat){ return ats.filter(a=>a.cat===cat).reduce((s,a)=>s+a.cant,0); }

/* ============ MÉTRICAS ============ */
function metricas(){
  const ats=atsFiltradas(), casos=rollupCasos(ats);
  const bc=casos.filter(bajoControl);
  const conControl=casos.filter(c=>c.nControles>0);
  const con2=conControl.filter(c=>c.nControles>=2);
  const ingresados=casos.filter(c=>c.tieneIngreso);
  const ingConEDI=ingresados.filter(c=>c.tieneEDI);
  const ctrlTot=catCount(ats,'control_sm')+catCount(ats,'control_sm_remoto');
  // % dupla en controles
  const ctrlAts=ats.filter(a=>a.cat==='control_sm'||a.cat==='control_sm_remoto');
  const ctrlDupla=ctrlAts.filter(a=>a.tp==='PSI'||a.tp==='AS').reduce((s,a)=>s+a.cant,0);
  const ctrlTotAll=ctrlAts.reduce((s,a)=>s+a.cant,0);
  const ingresos=catCount(ats,'ingreso');
  const egresos=catCount(ats,'egreso_alta')+catCount(ats,'egreso_abandono');
  const denom=DATA.poblacion.tramo_0_9_estimado||1;
  const mesesN=new Set(ats.map(a=>a.mes).filter(Boolean)).size||1;
  return {
    ats,casos,bc,conControl,con2,ingresados,ingConEDI,ctrlTot,
    nBajoControl:bc.length,
    cobertura:pct(bc.length,denom),
    ingresos, edi:catCount(ats,'edi'), visitas:catCount(ats,'visita_educativa'),
    egresosAlta:catCount(ats,'egreso_alta'), egresos,
    continuidad:pct(con2.length,conControl.length),
    concentracion: ctrlTot/(conControl.length||1),
    concentracionAnual: (ctrlTot/(conControl.length||1))*(12/mesesN),
    coberturaEDI: pct(ingConEDI.length, ingresados.length),
    permanencia: 100*(1-(egresos/(ingresos||1))),
    duplaPct: pct(ctrlDupla, ctrlTotAll),
    mesesN, denom
  };
}

/* ============ GRÁFICOS SVG ============ */
const PAL=['#1f8a99','#2aa5b5','#14525e','#5bc0cf','#0f3b44','#89d5df','#1a6675'];
function barChart(labels,series,{stacked=false,h=230,fmtY=fmt,colors=PAL,yMax=null,unit=''}={}){
  const W=760,H=h,padL=44,padR=14,padT=12,padB=44, iw=W-padL-padR, ih=H-padT-padB;
  const groups=labels.length;
  let maxV = yMax!=null?yMax: (stacked? Math.max(...labels.map((_,i)=>series.reduce((s,se)=>s+(se.data[i]||0),0)),1)
                 : Math.max(...series.flatMap(s=>s.data),1));
  maxV = niceMax(maxV);
  const gx = iw/groups;
  const y = v => padT+ih-(v/maxV)*ih;
  let svg=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  // grid + y labels
  const ticks=4;
  for(let t=0;t<=ticks;t++){const v=maxV*t/ticks;const yy=y(v);
    svg+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    svg+=`<text x="${padL-7}" y="${yy+4}" text-anchor="end" font-size="10.5">${fmtY(Math.round(v))}</text>`;}
  labels.forEach((lab,i)=>{
    const x0=padL+i*gx;
    if(stacked){
      let acc=0;
      series.forEach((se,si)=>{const v=se.data[i]||0;if(v<=0)return;const bh=(v/maxV)*ih;const yy=y(acc+v);
        svg+=`<rect class="bar-rect" x="${x0+gx*0.18}" y="${yy}" width="${gx*0.64}" height="${bh}" rx="2" fill="${(se.color||colors[si%colors.length])}"><title>${lab} · ${se.name}: ${fmt(v)}${unit}</title></rect>`;acc+=v;});
    }else{
      const bw=gx*0.72/series.length;
      series.forEach((se,si)=>{const v=se.data[i]||0;const bh=(v/maxV)*ih;const xx=x0+gx*0.14+si*bw;const yy=y(v);
        svg+=`<rect class="bar-rect" x="${xx}" y="${yy}" width="${bw*0.86}" height="${bh}" rx="2" fill="${(se.color||colors[si%colors.length])}"><title>${lab} · ${se.name}: ${fmt(v)}${unit}</title></rect>`;});
    }
    svg+=`<text x="${x0+gx/2}" y="${H-padB+16}" text-anchor="middle" font-size="10">${lab}</text>`;
  });
  svg+='</svg>';
  return svg;
}
function lineChart(labels,series,{h=230,unit=''}={}){
  const W=760,H=h,padL=44,padR=14,padT=12,padB=44,iw=W-padL-padR,ih=H-padT-padB;
  let maxV=niceMax(Math.max(...series.flatMap(s=>s.data),1));
  const x=i=>padL+(labels.length<=1?iw/2:i*iw/(labels.length-1));
  const y=v=>padT+ih-(v/maxV)*ih;
  let svg=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  const ticks=4;
  for(let t=0;t<=ticks;t++){const v=maxV*t/ticks;const yy=y(v);
    svg+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/>`;
    svg+=`<text x="${padL-7}" y="${yy+4}" text-anchor="end" font-size="10.5">${fmt(Math.round(v))}</text>`;}
  labels.forEach((lab,i)=>{ if(labels.length>10 && i%2) return;
    svg+=`<text x="${x(i)}" y="${H-padB+16}" text-anchor="middle" font-size="9.5">${lab.slice(2)}</text>`;});
  series.forEach((se,si)=>{const col=se.color||PAL[si%PAL.length];
    let d=se.data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
    se.data.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${col}"><title>${labels[i]} · ${se.name}: ${fmt(v)}${unit}</title></circle>`;});
  });
  svg+='</svg>';return svg;
}
function donut(items,{size=168}={}){
  const tot=items.reduce((s,i)=>s+i.v,0)||1;const r=size/2,ir=r*0.6;let a=-Math.PI/2;
  let svg=`<svg class="svgchart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto">`;
  items.forEach(it=>{const frac=it.v/tot;const a2=a+frac*2*Math.PI;
    const x1=r+r*Math.cos(a),y1=r+r*Math.sin(a),x2=r+r*Math.cos(a2),y2=r+r*Math.sin(a2);
    const xi2=r+ir*Math.cos(a2),yi2=r+ir*Math.sin(a2),xi1=r+ir*Math.cos(a);yi1=r+ir*Math.sin(a);
    const large=frac>0.5?1:0;
    if(it.v>0) svg+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${xi2} ${yi2} A${ir} ${ir} 0 ${large} 0 ${r+ir*Math.cos(a)} ${r+ir*Math.sin(a)} Z" fill="${it.c}"><title>${it.n}: ${fmt(it.v)} (${(100*frac).toFixed(0)}%)</title></path>`;
    a=a2;});
  svg+=`<text x="${r}" y="${r-2}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--txt)">${fmt(tot)}</text>`;
  svg+=`<text x="${r}" y="${r+15}" text-anchor="middle" font-size="10">casos</text></svg>`;
  return svg;
}
function hbar(items,{unit='',color='var(--teal)'}={}){
  const max=Math.max(...items.map(i=>i.v),1);
  return `<div style="display:flex;flex-direction:column;gap:7px">`+items.map(it=>`
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:150px;font-size:12px;color:var(--txt-soft);text-align:right;flex:0 0 150px">${it.n}</div>
      <div style="flex:1;background:var(--gris-bg);border-radius:5px;height:18px;position:relative">
        <div style="width:${100*it.v/max}%;background:${it.c||color};height:100%;border-radius:5px;min-width:2px"></div>
      </div>
      <div style="width:64px;font-size:12px;font-weight:650;text-align:right;flex:0 0 64px" class="mono">${fmt(it.v)}${unit}</div>
    </div>`).join('')+`</div>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=5?5:10;return m*p;}

  const estPill={ingresado:'verde',sin_ingreso_formal:'amarillo',egresado_alta:'gris',egresado_abandono:'rojo'};

  t.append(el('thead',{},el('tr',{},...[['caso','Caso'],['edad','Edad'],['banda','Banda'],['sexo','Sexo'],['centro','Centro'],['estado','Estado'],['nAt','Atenc.'],['nControles','Controles'],['tieneEDI','EDI'],['nMeses','Meses act.'],['ultima','Últ. atención']].map(([k,l])=>
    el('th',{class:['edad','nAt','nControles','nMeses'].includes(k)?'num':'',onclick:()=>{casoOrden=k;render();}},l)))));
  const tb=el('tbody');
  casos.slice(0,400).forEach(cs=>{
    tb.append(el('tr',{},
      el('td',{},el('code',{},cs.caso)),
      el('td',{class:'num mono'},cs.edad??'—'),
      el('td',{},cs.banda),
      el('td',{},cs.sexo==='H'?'H':cs.sexo==='M'?'M':'—'),
      el('td',{},cs.centro==='TONGOY'?'Tongoy':cs.centro==='GUANAQUEROS'?'Guanaqueros':cs.centro==='OTRO'?'Otro':'—'),
      el('td',{},el('span',{class:'pill '+(estPill[cs.estado]||'gris')},estados[cs.estado]||cs.estado)),
      el('td',{class:'num mono'},fmt(cs.nAt)),
      el('td',{class:'num mono'},fmt(cs.nControles)),
      el('td',{},cs.tieneEDI?'✓':'·'),
      el('td',{class:'num mono'},cs.nMeses),
      el('td',{class:'mono',style:'font-size:12px'},cs.ultima||'—')));
  });
  t.append(tb);
  c.append(note,seg,el('div',{class:'muted',style:'font-size:12px;margin-bottom:6px'},`${fmt(casos.length)} casos en el filtro (clic en encabezado para ordenar; se muestran hasta 400).`),el('div',{class:'tbl-wrap'},t));
}
function exportCasosCSV(m){
  const hd=['caso','edad','banda','sexo','centro','estado','n_atenciones','n_controles','tiene_edi','n_meses_activo','primera','ultima'];
  const rows=m.casos.map(c=>[c.caso,c.edad??'',c.banda,c.sexo,c.centro,c.estado,c.nAt,c.nControles,c.tieneEDI?1:0,c.nMeses,c.primera||'',c.ultima||'']);
  const csv=[hd.join(';'),...rows.map(r=>r.join(';'))].join('\n');
  descargar(new Blob([csv],{type:'text/csv;charset=utf-8'}),'casos_pasmi_pseudonimizado.csv');
}

/* ---------- PERFIL ---------- */
function vPerfil(c,m){
  const perfil=Object.entries(DATA.perfilDiagnostico).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  const cardDx=el('div',{class:'card'},el('h3',{},'🧠 Perfil diagnóstico (agregado — líneas de ingreso/EDI)'),
    el('div',{class:'muted',style:'font-size:12px;margin-bottom:10px'},'Agregado de todo el período y universo del archivo (no se filtra por caso para preservar confidencialidad).'),
    el('div',{html:hbar(perfil,{color:'var(--petroleo-3)'})}));
  // producción por categoría (filtro actual)
  const cats=Object.keys(CATL()).map(k=>({n:CATL()[k],v:catCount(m.ats,k),c:'var(--teal)'})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const cardProd=el('div',{class:'card'},el('h3',{},'📦 Producción por categoría (filtro actual)'),el('div',{html:hbar(cats,{})}));
  // edad / sexo
  const bandas=['0-4','5-9','10+'];const porBanda=bandas.map((b,i)=>({n:b,v:m.casos.filter(c=>c.banda===b).length,c:PAL[i]}));
  const porSexo=[['H','Hombre','#1f8a99'],['M','Mujer','#2aa5b5'],['SD','Sin dato','#8a9aa0']].map(([k,n,c])=>({n,v:m.casos.filter(cs=>cs.sexo===k).length,c})).filter(x=>x.v);
  const cardDemo=el('div',{class:'card'},el('h3',{},'👶 Casos por edad y sexo'),
    el('div',{class:'grid',style:'grid-template-columns:1fr 1fr'},
      el('div',{},el('div',{class:'muted',style:'font-size:12px;margin-bottom:8px'},'Por banda etaria'),donutWrap(porBanda)),
      el('div',{},el('div',{class:'muted',style:'font-size:12px;margin-bottom:8px'},'Por sexo'),donutWrap(porSexo))));
  c.append(el('div',{class:'grid',style:'grid-template-columns:1fr 1fr;align-items:start'},cardDx,cardProd),el('div',{style:'height:16px'}),cardDemo);
}
function donutWrap(items){const wrap=el('div',{});wrap.innerHTML=donut(items,{size:150});wrap.append(el('div',{class:'legend'},items.map(d=>el('span',{},el('span',{class:'sw',style:`background:${d.c}`}),`${d.n} (${fmt(d.v)})`))));return wrap;}

/* ---------- CONFIG ---------- */
function vConfig(c){
  // Metas
  const M=DATA.metas2027;
  const cMetas=el('div',{class:'card'},el('h3',{},'🎯 Metas 2027 (editables)'));
  const tM=el('table');tM.append(el('thead',{},el('tr',{},el('th',{},'Indicador'),el('th',{class:'num'},'Meta'),el('th',{},'Unidad'))));
  const tbM=el('tbody');
  Object.entries(M).forEach(([k,o])=>{tbM.append(el('tr',{},el('td',{},o.label),
    el('td',{class:'num'},el('input',{class:'inp',type:'number',value:o.meta,onchange:e=>{o.meta=parseFloat(e.target.value)||0;}})),el('td',{},o.unidad)));});
  tM.append(tbM);cMetas.append(tM);
  // Poblacion
  const P=DATA.poblacion;
  const cPob=el('div',{class:'card'},el('h3',{},'👥 Denominador poblacional (editable)'),
    el('div',{class:'muted',style:'font-size:12px;margin-bottom:10px'},'Ajusta aquí el denominador 0–9 cuando tengas el per cápita por quinquenios. La cobertura se recalcula con este valor.'));
  const tP=el('table');const tbP=el('tbody');
  [['inscrita_validada','Población inscrita validada'],['infantil_0_14','Población 0–14'],['tramo_0_9_estimado','Población 0–9 (denominador cobertura)'],['menores_5','Menores de 5']].forEach(([k,l])=>{
    tbP.append(el('tr',{},el('td',{},l),el('td',{class:'num'},el('input',{class:'inp',type:'number',value:P[k],onchange:e=>{P[k]=parseInt(e.target.value)||0;}}))));});
  tP.append(tbP);cPob.append(tP);
  // Taxonomía
  const cTax=el('div',{class:'card'},el('h3',{},'🏷️ Taxonomía de prestaciones (prestación → categoría)'),
    el('div',{class:'muted',style:'font-size:12px;margin-bottom:10px'},`${Object.keys(DATA.taxonomia).length} descripciones mapeadas. Edita una categoría si corresponde; "Guardar" conserva los cambios en el JSON.`));
  const cats=Object.keys(CATL());
  const tT=el('table');tT.append(el('thead',{},el('tr',{},el('th',{},'Descripción (prestación)'),el('th',{},'Categoría'))));
  const tbT=el('tbody');
  Object.entries(DATA.taxonomia).sort().forEach(([desc,cat])=>{
    const s=el('select',{class:'inp',style:'width:220px',onchange:e=>{DATA.taxonomia[desc]=e.target.value;}});
    cats.forEach(k=>{const o=el('option',{value:k},CATL()[k]);if(k===cat)o.selected=true;s.append(o);});
    tbT.append(el('tr',{},el('td',{style:'font-size:12px'},desc),el('td',{},s)));});
  tT.append(tbT);
  cTax.append(el('div',{class:'tbl-wrap',style:'max-height:340px'},tT),
    el('div',{class:'note warn',style:'margin-top:12px'},'Nota: cambiar la taxonomía aquí ajusta la etiqueta en el JSON guardado, pero el recálculo de categorías por atención se hace en el pipeline de carga. Para re-mapear con tus cambios, vuelve a ejecutar el pipeline o pídemelo y lo regenero.'));
  // Datos / resguardos
  const cDat=el('div',{class:'card'},el('h3',{},'🗄️ Datos y resguardos'),
    el('div',{html:`<div style="font-size:13px;line-height:1.7">
      <b>Fuente:</b> ${DATA.meta.fuente}<br>
      <b>Establecimiento:</b> ${DATA.meta.establecimiento}<br>
      <b>Período:</b> ${DATA.meta.periodo.desde} → ${DATA.meta.periodo.hasta}<br>
      <b>Atenciones:</b> ${fmt(DATA.meta.nAtenciones)} · <b>Casos:</b> ${fmt(DATA.meta.nCasos)}<br>
      <b>Resguardo:</b> ${DATA.meta.resguardo}</div>`}),
    el('div',{class:'flex',style:'margin-top:14px'},
      el('button',{class:'tool',onclick:guardarJSON},'💾 Guardar JSON (con metas editadas)'),
      el('label',{class:'tool'},'📂 Cargar otro JSON',el('input',{type:'file',accept:'application/json',style:'display:none',onchange:cargarJSON}))));
  c.append(el('div',{class:'note'},'Configuración del centro. Los cambios de metas y denominador se aplican en vivo a los indicadores; recuerda ',el('b',{},'Guardar JSON'),' para conservarlos.'),
    el('div',{class:'grid',style:'grid-template-columns:1fr 1fr;align-items:start'},cMetas,cPob),
    el('div',{style:'height:16px'}),cDat,el('div',{style:'height:16px'}),cTax);
}

/* ============ IO ============ */
function descargar(blob,nombre){const u=URL.createObjectURL(blob);const a=el('a',{href:u,download:nombre});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function guardarJSON(){descargar(new Blob([JSON.stringify(DATA)],{type:'application/json'}),'pasmi_data.json');}
function cargarJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.atenciones)throw 0;DATA=d;const meses=MESES_ALL();state.f.mesDesde=meses[0];state.f.mesHasta=meses[meses.length-1];renderNav();renderFilters();render();}catch(err){alert('No se pudo leer el JSON: estructura no válida.');}};r.readAsText(f);}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);}

/* ============ INIT ============ */
(function init(){
  const meses=MESES_ALL();state.f.mesDesde=meses[0];state.f.mesHasta=meses[meses.length-1];
  if(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches){state.theme='dark';document.documentElement.setAttribute('data-theme','dark');}
  renderNav();renderFilters();render();
})();
</script>
